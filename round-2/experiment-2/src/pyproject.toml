[project]
name = "gen_art_experiment_2"
version = "0.1.0"
description = "Global Zipf Fit on Pride and Prejudice - MLE fitting of Zipf and Zipf-Mandelbrot models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.16.3",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "loguru==0.7.3",
    "jsonschema==4.25.1",
    "PyYAML==6.0.3",
    "tqdm==4.67.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest==8.4.1",
    "ruff==0.11.13",
]