[project]
name = "zipfian-fit-evaluation"
version = "1.0.0"
description = "Global Zipfian Fit Accuracy Analysis - MLE-based fitting of Zipf and Zipf-Mandelbrot models to Pride and Prejudice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs==26.1.0",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.68.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kiwisolver==1.5.1",
    "loguru==0.8.0",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "packaging==26.3",
    "pillow==13.0.0",
    "pyparsing==3.3.3",
    "python-dateutil==4.0.0",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "scipy==1.18.1",
    "typing-extensions==4.16.0",
    "tzdata==2026.6",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []