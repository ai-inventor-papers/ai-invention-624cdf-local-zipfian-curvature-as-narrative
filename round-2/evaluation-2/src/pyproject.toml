[project]
name = "zipfian-fit-evaluation"
version = "1.0.0"
description = "Global Zipfian Fit Accuracy Analysis - MLE-based fitting of Zipf and Zipf-Mandelbrot models to Pride and Prejudice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.16.3",
    "loguru==0.7.3",
    "matplotlib==3.10.7",
    "jsonschema==4.25.1",
    "kiwisolver==1.4.9",
    "pillow==13.0.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.63.0",
    "packaging==25.0",
    "pyparsing==3.2.5",
    "python-dateutil==2.9.0.post0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []